<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Warriors — Fase 0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1c1610; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: absolute; inset: 0; pointer-events: none;
        font-family: "Cormorant Garamond", "Palatino Linotype", Palatino, Georgia, serif; color: #e8dcc4;
      }
      #hud .panel {
        pointer-events: auto;
        background: rgba(123, 83, 42, 0.88);
        border: 1px solid rgba(160, 120, 70, 0.45);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
        color: #cabb9d;
      }
      /* HUD combate estilo Diablo/MU: orbes abajo */
      #combat-hud {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; align-items: flex-end; justify-content: center;
        gap: clamp(8px, 2vw, 20px);
        padding: 0 10px max(10px, env(safe-area-inset-bottom));
        pointer-events: none;
        background: linear-gradient(to top, rgba(12,8,4,.72) 0%, rgba(12,8,4,.35) 55%, transparent 100%);
      }
      .orb {
        position: relative;
        width: clamp(72px, 18vw, 110px);
        height: clamp(72px, 18vw, 110px);
        flex-shrink: 0;
      }
      .orb-frame {
        position: absolute; inset: 0;
        border-radius: 50%;
        border: 3px solid #c4a574;
        box-shadow:
          0 0 0 2px #2a1c10,
          inset 0 0 0 2px rgba(0,0,0,.55),
          0 6px 18px rgba(0,0,0,.55);
        background:
          radial-gradient(circle at 30% 22%, rgba(255,240,200,.22), transparent 42%),
          linear-gradient(160deg, #3a2a18 0%, #1a120a 100%);
        overflow: hidden;
      }
      .orb-well {
        position: absolute; inset: 8%;
        border-radius: 50%;
        overflow: hidden;
        background: #0a0705;
        box-shadow: inset 0 0 12px rgba(0,0,0,.8);
      }
      .orb-fill {
        position: absolute; left: 0; right: 0; bottom: 0;
        transition: height 0.12s linear;
      }
      .orb-hp .orb-fill {
        background: linear-gradient(to top, #4a0e0e 0%, #a02020 45%, #e05040 78%, #f0a090 100%);
        box-shadow: 0 0 16px rgba(180,40,30,.45);
      }
      .orb-en .orb-fill {
        background: linear-gradient(to top, #0a2a3a 0%, #1a6a9a 45%, #3ab0e0 78%, #a8e8ff 100%);
        box-shadow: 0 0 16px rgba(40,140,200,.4);
      }
      .orb-gloss {
        position: absolute; inset: 10% 18% auto 18%; height: 28%;
        border-radius: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,.28), transparent);
        pointer-events: none;
      }
      .orb-label {
        position: absolute; left: 50%; bottom: 18%;
        transform: translateX(-50%);
        font-size: clamp(9px, 2.4vw, 12px);
        font-weight: 700;
        color: #f5ebd4;
        text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.8);
        white-space: nowrap;
        letter-spacing: 0.02em;
      }
      .orb-caption {
        position: absolute; left: 50%; top: 100%;
        transform: translateX(-50%);
        margin-top: 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #c4a574;
        text-shadow: 0 1px 2px #000;
        opacity: 0.9;
      }
      .hud-belt {
        min-width: min(220px, 42vw);
        max-width: 280px;
        margin-bottom: clamp(10px, 3vw, 22px);
        padding: 8px 12px 10px;
        border-radius: 4px;
        background: linear-gradient(180deg, rgba(42,30,18,.92), rgba(18,12,8,.94));
        border: 1px solid rgba(196,165,116,.5);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.4);
        text-align: center;
        font-size: 12px;
        line-height: 1.35;
      }
      .hud-belt .weapon-name {
        color: #f0e0c0; font-size: 13px; font-weight: 700;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .hud-belt .weapon-stats { opacity: .8; font-size: 11px; margin-top: 2px; }
      .hud-belt .core-stats {
        margin-top: 4px; font-size: 11px; color: #d4b888;
        letter-spacing: 0.04em;
      }
      .hud-belt .meta { opacity: .65; font-size: 10px; margin-top: 4px; }
      .cd-pip {
        margin-top: 6px; height: 4px; background: #2a2016;
        border: 1px solid rgba(0,0,0,.4); border-radius: 1px; overflow: hidden;
      }
      .cd-pip > i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, #8a6a30, #e0c070);
        transition: width 0.08s linear;
      }
      @media (max-width: 480px) {
        .orb-caption { display: none; }
        .hud-belt { min-width: 0; flex: 1; padding: 6px 8px; font-size: 11px; }
        .hud-belt .weapon-name { font-size: 12px; }
      }
      #inv, #char {
        display: none;
        position: absolute; top: 0; bottom: 0;
        overflow: hidden;
        padding: 10px 14px 12px;
        pointer-events: auto;
        color: #3a2614;
        background:
          radial-gradient(ellipse at 18% 12%, rgba(255,248,220,.45), transparent 42%),
          radial-gradient(ellipse at 85% 88%, rgba(120,70,30,.18), transparent 48%),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(90, 55, 25, 0.03) 3px,
            rgba(90, 55, 25, 0.03) 4px
          ),
          linear-gradient(165deg, #f0e0b8 0%, #e2c992 42%, #d4b278 100%);
        border: 3px solid #6b4424;
        box-shadow:
          inset 0 0 0 1px rgba(255, 236, 190, 0.55),
          inset 0 0 40px rgba(120, 70, 30, 0.18),
          0 0 28px rgba(0, 0, 0, 0.45);
      }
      #inv {
        right: 0;
        width: min(620px, 100vw);
        border-right: none;
        border-radius: 8px 0 0 8px;
      }
      #char {
        left: 0;
        width: min(280px, 100vw);
        border-left: none;
        border-radius: 0 8px 8px 0;
      }
      #inv.open, #char.open { display: flex; flex-direction: column; }
      #char.open { overflow: auto; }
      .inv-title, .char-title {
        font-family: Cinzel, "Cormorant Garamond", serif;
        font-size: 16px; margin-bottom: 8px; font-weight: 700;
        letter-spacing: 0.12em;
        color: #2a180c;
        display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
        padding: 0 4px 8px;
        flex: 0 0 auto;
        border-bottom: none;
        background:
          linear-gradient(90deg, transparent, rgba(107,68,36,.55) 12%, rgba(107,68,36,.55) 88%, transparent) bottom / 100% 1px no-repeat;
        text-shadow: 0 1px 0 rgba(255, 244, 210, 0.55);
      }
      .inv-title span, .char-title span { opacity: 0.65; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; }
      .inv-coins, .char-coins {
        font-family: Cinzel, serif;
        color: #7a4e10; font-weight: 700; letter-spacing: 0.04em;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .coin-icon {
        width: 1.1em; height: 1.1em;
        flex: 0 0 auto;
        display: block;
        overflow: visible;
      }
      .inv-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
        flex: 1 1 auto;
        min-height: 0;
      }
      .inv-section, .char-section {
        font-family: Cinzel, serif;
        font-size: 10px; margin: 0 0 6px;
        text-transform: uppercase; letter-spacing: 0.18em;
        color: #b59372;
        text-align: center;
        position: relative;
      }
      .inv-section::before, .inv-section::after,
      .char-section::before, .char-section::after {
        content: "✦";
        font-size: 9px;
        opacity: 0.45;
        margin: 0 8px;
      }
      .char-core {
        display: grid; gap: 8px; margin-bottom: 14px;
        padding: 10px 12px;
        background: rgba(90, 55, 25, 0.08);
        border: 1px solid rgba(90, 55, 25, 0.28);
        box-shadow: inset 0 0 12px rgba(255, 240, 200, 0.2);
      }
      .char-core-row {
        display: flex; justify-content: space-between; font-size: 13px;
      }
      .char-core-row b { color: #ccc57c; }
      .stat-shop { display: grid; grid-template-columns: 1fr; gap: 6px; }
      .stat-buy {
        display: flex; align-items: center; justify-content: space-between;
        gap: 6px; width: 100%; padding: 10px 12px;
        border-radius: 2px; cursor: pointer; font-family: inherit; font-size: 13px;
        color: #000000;
        background: rgba(223, 203, 141, 0.704);
        border: 1px solid rgba(107, 68, 36, 0.45);
        box-shadow: inset 0 1px 0 rgba(255, 255, 240, 0.5);
      }
      .stat-buy:hover { border-color: #8a5a12; background: rgba(255, 248, 220, 0.85); }
      .stat-buy.disabled { opacity: 0.4; }
      .stat-buy-label b { color: #2c1a0c; }
      .stat-buy-cost { color: #0f0c07; font-size: 15px; white-space: nowrap; }
      .paper-doll {
        --slot: clamp(52px, 7.8vh, 76px);
        --slot-lg: clamp(68px, 10vh, 96px);
        --slot-sm: clamp(44px, 6.5vh, 62px);
        --slot-xs: clamp(28px, 4vh, 38px);
        position: relative;
        display: grid;
        grid-template-columns: var(--slot-lg) var(--slot-lg) var(--slot-lg);
        grid-template-areas:
          ". amulet ."
          ". helmet ."
          "weapon armor offhand"
          "gloves belt pants"
          "ring1 boots ring2";
        gap: clamp(4px, 0.8vh, 8px) clamp(8px, 1.2vw, 14px);
        justify-content: center;
        justify-items: center;
        align-items: center;
        padding: clamp(12px, 1.8vh, 20px) 16px;
        border-radius: 4px;
        background:
          radial-gradient(ellipse 42% 58% at 50% 46%, rgba(62, 40, 22, 0.22), transparent 70%),
          linear-gradient(180deg, rgba(255,246,220,0.35), rgba(180,140,80,0.12));
        border: 1px solid rgba(107, 68, 36, 0.45);
        box-shadow:
          inset 0 0 0 1px rgba(255, 236, 190, 0.35),
          inset 0 0 48px rgba(90, 55, 25, 0.12),
          0 2px 0 rgba(255, 240, 200, 0.2);
      }
      .paper-doll::before {
        content: "";
        position: absolute;
        inset: 10px;
        pointer-events: none;
        border: 1px solid rgba(107, 68, 36, 0.28);
        border-radius: 2px;
        background:
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) top left / 18px 1px no-repeat,
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) top left / 1px 18px no-repeat,
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) top right / 18px 1px no-repeat,
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) top right / 1px 18px no-repeat,
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) bottom left / 18px 1px no-repeat,
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) bottom left / 1px 18px no-repeat,
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) bottom right / 18px 1px no-repeat,
          linear-gradient(rgba(90,55,25,.35), rgba(90,55,25,.35)) bottom right / 1px 18px no-repeat;
      }
      .paper-doll::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 18%;
        width: 118px;
        height: 62%;
        transform: translateX(-50%);
        pointer-events: none;
        opacity: 0.14;
        background:
          radial-gradient(ellipse 55% 18% at 50% 8%, #3a2818 0 70%, transparent 72%),
          radial-gradient(ellipse 70% 42% at 50% 38%, #3a2818 0 68%, transparent 70%),
          radial-gradient(ellipse 48% 28% at 50% 72%, #3a2818 0 65%, transparent 68%),
          radial-gradient(ellipse 22% 16% at 28% 88%, #3a2818 0 60%, transparent 62%),
          radial-gradient(ellipse 22% 16% at 72% 88%, #3a2818 0 60%, transparent 62%);
        filter: blur(0.2px);
      }
      .pd-amulet, .pd-helmet, .pd-weapon, .pd-armor, .pd-offhand,
      .pd-gloves, .pd-belt, .pd-pants, .pd-boots, .pd-ring1, .pd-ring2 {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .pd-amulet { grid-area: amulet; }
      .pd-helmet { grid-area: helmet; }
      .pd-weapon { grid-area: weapon; }
      .pd-armor { grid-area: armor; }
      .pd-offhand { grid-area: offhand; }
      .pd-gloves { grid-area: gloves; }
      .pd-belt { grid-area: belt; }
      .pd-pants { grid-area: pants; }
      .pd-boots { grid-area: boots; }
      .pd-ring1 { grid-area: ring1; }
      .pd-ring2 { grid-area: ring2; }
      .eq-slot {
        width: var(--slot); height: var(--slot);
        border-radius: 6px;
        border: 2px solid #8a6232;
        background:
          radial-gradient(circle at 30% 22%, rgba(255,230,170,0.12), transparent 45%),
          linear-gradient(160deg, #4a3220 0%, #2a1a10 55%, #1c120a 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        cursor: pointer; text-align: center; padding: 6px;
        color: #e8dcc4; font-family: inherit;
        box-shadow:
          0 0 0 1px rgba(40, 24, 10, 0.85),
          inset 0 1px 0 rgba(255, 220, 150, 0.22),
          inset 0 -10px 18px rgba(0, 0, 0, 0.35),
          0 3px 8px rgba(40, 22, 8, 0.25);
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
      }
      .eq-slot:hover {
        border-color: #c4923a;
        box-shadow:
          0 0 0 1px rgba(40, 24, 10, 0.85),
          inset 0 1px 0 rgba(255, 230, 170, 0.3),
          0 0 14px rgba(180, 120, 40, 0.25);
        transform: translateY(-1px);
      }
      .eq-slot.sm { width: var(--slot-sm); height: var(--slot-sm); border-radius: 5px; }
      .eq-slot.lg { width: var(--slot-lg); height: var(--slot-lg); border-radius: 7px; }
      .eq-slot.xs { width: var(--slot-xs); height: var(--slot-xs); border-radius: 4px; padding: 2px; }
      .eq-slot.xs .eq-glyph { width: 55%; height: 55%; }
      .eq-slot.empty { opacity: 1; }
      .eq-slot.empty .eq-glyph { opacity: 0.38; }
      .eq-slot.filled {
        --glow: #c4a574;
        --glow-str: 0.2;
        border-color: #b8862e;
        background:
          radial-gradient(circle at 32% 20%, rgba(255,220,140,0.18), transparent 42%),
          linear-gradient(160deg, #5a3c22 0%, #342010 60%, #221408 100%);
        box-shadow:
          0 0 0 1px rgba(40, 24, 10, 0.85),
          inset 0 1px 0 rgba(255, 220, 150, 0.22),
          0 0 calc(8px + 16px * var(--glow-str)) color-mix(in srgb, var(--glow) calc(20% + 40% * var(--glow-str)), transparent);
      }
      .eq-slot.filled .eq-glyph { display: none; }
      .eq-glyph {
        width: 52%;
        height: 52%;
        fill: none;
        stroke: #d4b078;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .eq-slot.sm .eq-glyph { width: 48%; height: 48%; }
      .eq-label {
        font-family: Cinzel, serif;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6a4520;
        line-height: 1.1;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }
      .eq-slot .eq-label { display: none; }
      .item-icon {
        width: 92%; height: 92%; object-fit: cover; pointer-events: none;
        --glow: #c4a574;
        --glow-str: 0.2;
        filter:
          drop-shadow(0 4px 6px rgba(0,0,0,.55))
          drop-shadow(0 0 calc(6px + 14px * var(--glow-str)) color-mix(in srgb, var(--glow) calc(30% + 55% * var(--glow-str)), transparent));
        image-rendering: auto;
      }
      .eq-slot .item-icon { width: 88%; height: 88%; }
      .inv-equip, .inv-storage { min-width: 0; display: flex; flex-direction: column; align-items: center; }
      .inv-equip { flex: 0 0 auto; }
      .inv-storage { flex: 1 1 auto; min-height: 0; justify-content: flex-start; }
      .inv-equip .inv-section, .inv-storage .inv-section { align-self: stretch; }
      .bag-frame {
        padding: 6px;
        border-radius: 4px;
        background: linear-gradient(180deg, rgba(70,45,22,0.2), rgba(40,24,12,0.28));
        border: 1px solid rgba(107, 68, 36, 0.4);
        box-shadow: inset 0 0 0 1px rgba(255, 236, 190, 0.25);
        flex: 0 0 auto;
      }
      .bag-grid {
        --cell: clamp(28px, 5.2vh, 40px);
        --gap: 2px;
        display: grid;
        gap: var(--gap);
        width: max-content;
        margin: 0 auto;
        padding: 6px;
        background: linear-gradient(180deg, #2a1c12, #1a120c);
        border: 2px solid #7a5530;
        border-radius: 3px;
        box-shadow:
          inset 0 0 0 1px rgba(0,0,0,.45),
          inset 0 0 20px rgba(0,0,0,.25),
          0 1px 0 rgba(255,230,180,.18);
        overflow: visible;
      }
      .bag-cell {
        --glow: #c4a574;
        --glow-str: 0.2;
        width: var(--cell);
        height: var(--cell);
        background: rgba(22, 14, 8, 0.75);
        border: 1px solid rgba(90, 55, 25, 0.35);
        box-sizing: border-box;
        pointer-events: none;
        border-radius: 1px;
      }
      .bag-cell.occupied {
        border-color: color-mix(in srgb, var(--glow) 75%, #8a6232);
        background:
          radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--glow) calc(18% + 28% * var(--glow-str)), transparent), rgba(22, 14, 8, 0.55) 72%);
        box-shadow:
          inset 0 0 0 1px color-mix(in srgb, var(--glow) calc(35% + 40% * var(--glow-str)), transparent),
          0 0 calc(4px + 10px * var(--glow-str)) color-mix(in srgb, var(--glow) calc(25% + 45% * var(--glow-str)), transparent);
      }
      .bag-item {
        --glow: #c4a574;
        --glow-str: 0.2;
        z-index: 2;
        touch-action: none;
        cursor: grab;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border-radius: 0;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        color: inherit; font-family: inherit;
        box-shadow: none;
      }
      .bag-item:hover {
        border: none;
        background: transparent;
        filter: brightness(1.12);
      }
      .bag-item.dragging { opacity: 0.28; cursor: grabbing; }
      .bag-ghost {
        position: fixed;
        z-index: 90;
        margin: 0;
        pointer-events: none;
        opacity: 0.92;
      }
      .bag-item .item-icon {
        width: 100%; height: 100%; object-fit: cover;
        animation: item-float 2.8s ease-in-out infinite;
      }
      @keyframes item-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @media (max-width: 700px) {
        #inv, #char {
          width: 100vw;
          border-radius: 0;
          border-left: 3px solid #6b4424;
          border-right: 3px solid #6b4424;
        }
        .paper-doll {
          --slot: min(clamp(52px, 7.8vh, 76px), 20vw);
          --slot-lg: min(clamp(68px, 10vh, 96px), 26vw);
          --slot-sm: min(clamp(44px, 6.5vh, 62px), 17vw);
          --slot-xs: min(clamp(28px, 4vh, 38px), 11vw);
          grid-template-columns: var(--slot-lg) var(--slot-lg) var(--slot-lg);
          padding: 10px 10px 8px;
          gap: 6px;
        }
        .bag-grid { --cell: min(clamp(28px, 5.2vh, 40px), calc((100vw - 48px) / 10 - 2px)); }
      }
      #tooltip {
        position: fixed; z-index: 50; display: none;
        min-width: 180px; max-width: 260px;
        padding: 10px 12px; border-radius: 4px;
        background: rgba(22, 16, 10, 0.95);
        border: 1px solid rgba(196, 165, 116, 0.55);
        color: #e8dcc4; font-size: 12px; line-height: 1.4;
        pointer-events: none;
      }
      #tooltip.show { display: block; }
      #tooltip .tt-name { font-size: 18px; font-weight: 700; line-height: 1.25; margin-bottom: 6px; }
      #tooltip .tt-meta { opacity: 0.7; text-transform: uppercase; font-size: 10px; margin-bottom: 8px; }
      #tooltip .tt-stat { margin: 2px 0; }
      #tooltip .tt-hint { margin-top: 8px; opacity: 0.55; font-size: 11px; }
      #help {
        position: absolute; top: 12px; right: 12px;
        padding: 10px 14px; border-radius: 4px; font-size: 12px; line-height: 1.5;
        max-width: 240px; opacity: 0.9;
      }
      #toast {
        position: absolute; left: 50%; bottom: clamp(130px, 28vw, 160px);
        transform: translateX(-50%);
        padding: 8px 12px; border-radius: 4px; font-size: 13px;
        max-width: min(280px, calc(100vw - 24px));
        opacity: 0; transition: opacity 0.2s; pointer-events: none;
        text-align: center;
      }
      #toast.show { opacity: 1; }
      #floaters { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .dmg {
        position: absolute; transform: translate(-50%, -50%);
        font-weight: 700; font-size: 18px; color: #ffe08a;
        text-shadow: 0 1px 2px #000; white-space: nowrap;
      }
      .ai-hp {
        position: absolute; transform: translate(-50%, -50%);
        width: 42px; height: 5px; background: #2a2016; border-radius: 2px; overflow: hidden;
        border: 1px solid rgba(0,0,0,.35);
      }
      .ai-hp > i { display: block; height: 100%; background: #8a3a2a; }
    </style>
  </head>
