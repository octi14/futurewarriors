<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Warriors — Fase 0</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1c1610; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: absolute; inset: 0; pointer-events: none;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; color: #e8dcc4;
      }
      #hud .panel {
        pointer-events: auto;
        background: rgba(28, 20, 12, 0.88);
        border: 1px solid rgba(160, 120, 70, 0.45);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
      }
      #stats {
        position: absolute; top: 12px; left: 12px;
        padding: 10px 14px; border-radius: 4px; min-width: 200px;
        font-size: 13px; line-height: 1.45;
      }
      #stats .hp-bar {
        margin-top: 6px; height: 10px; background: #2a2016; border-radius: 2px; overflow: hidden;
      }
      #stats .hp-fill { height: 100%; background: #8a3a2a; width: 100%; transition: width 0.12s linear; }
      #inv {
        display: none;
        position: absolute; top: 0; right: 0; bottom: 0;
        width: min(380px, 92vw);
        overflow: auto;
        padding: 14px;
        border-radius: 0;
        border-right: none; border-top: none; border-bottom: none;
      }
      #inv.open { display: block; }
      @media (max-width: 640px) {
        #inv { width: min(100vw, 100%); }
      }
      .inv-title { font-size: 16px; margin-bottom: 12px; }
      .inv-title span { opacity: 0.65; font-size: 12px; }
      .inv-body {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .inv-section {
        font-size: 11px; opacity: 0.75; margin: 0 0 8px;
        text-transform: uppercase; letter-spacing: 0.04em;
      }
      .paper-doll {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-areas:
          ". amulet ."
          ". helmet ."
          "weapon armor offhand"
          "gloves belt boots"
          "ring1 . ring2";
        gap: 6px;
        align-items: center;
        justify-items: center;
        padding: 8px;
        background: rgba(0,0,0,.22);
        border: 1px solid rgba(160, 120, 70, 0.25);
      }
      .pd-amulet { grid-area: amulet; }
      .pd-helmet { grid-area: helmet; }
      .pd-weapon { grid-area: weapon; }
      .pd-armor { grid-area: armor; }
      .pd-offhand { grid-area: offhand; }
      .pd-gloves { grid-area: gloves; }
      .pd-belt { grid-area: belt; }
      .pd-boots { grid-area: boots; }
      .pd-ring1 { grid-area: ring1; }
      .pd-ring2 { grid-area: ring2; }
      .eq-slot, .bag-slot {
        border-radius: 3px;
        border: 1px solid rgba(160, 120, 70, 0.4);
        background: rgba(36, 26, 16, 0.95);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        cursor: pointer; text-align: center; padding: 4px;
        color: #d9c6a5; font-family: inherit;
      }
      .eq-slot {
        width: 72px; height: 72px;
      }
      .eq-slot.sm { width: 58px; height: 58px; }
      .eq-slot.empty { opacity: 0.55; }
      .eq-slot.filled { outline: 1px solid rgba(196, 165, 116, 0.55); }
      .eq-label { font-size: 9px; opacity: 0.65; line-height: 1.1; }
      .item-icon {
        width: 78%; height: 78%; object-fit: contain; pointer-events: none;
        image-rendering: auto;
      }
      .eq-slot .item-icon { width: 70%; height: 55%; }
      .bag-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }
      .bag-slot {
        aspect-ratio: 1;
        min-height: 48px;
        width: 100%;
        padding: 2px;
      }
      .bag-slot.empty { opacity: 0.4; }
      #tooltip {
        position: fixed; z-index: 50; display: none;
        min-width: 180px; max-width: 260px;
        padding: 10px 12px; border-radius: 4px;
        background: rgba(22, 16, 10, 0.95);
        border: 1px solid rgba(196, 165, 116, 0.55);
        color: #e8dcc4; font-size: 12px; line-height: 1.4;
        pointer-events: none;
      }
      #tooltip.show { display: block; }
      #tooltip .tt-name { font-size: 14px; color: #f0e0c0; margin-bottom: 4px; }
      #tooltip .tt-meta { opacity: 0.7; text-transform: uppercase; font-size: 10px; margin-bottom: 8px; }
      #tooltip .tt-stat { margin: 2px 0; }
      #tooltip .tt-hint { margin-top: 8px; opacity: 0.55; font-size: 11px; }
      #help {
        position: absolute; top: 12px; right: 12px;
        padding: 10px 14px; border-radius: 4px; font-size: 12px; line-height: 1.5;
        max-width: 240px; opacity: 0.9;
      }
      #toast {
        position: absolute; left: 12px; bottom: 12px;
        padding: 8px 12px; border-radius: 4px; font-size: 13px;
        max-width: min(280px, calc(100vw - 24px));
        opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      #toast.show { opacity: 1; }
      #floaters { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .dmg {
        position: absolute; transform: translate(-50%, -50%);
        font-weight: 700; font-size: 18px; color: #ffe08a;
        text-shadow: 0 1px 2px #000; white-space: nowrap;
      }
      .ai-hp {
        position: absolute; transform: translate(-50%, -50%);
        width: 42px; height: 5px; background: #2a2016; border-radius: 2px; overflow: hidden;
        border: 1px solid rgba(0,0,0,.35);
      }
      .ai-hp > i { display: block; height: 100%; background: #8a3a2a; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="stats" class="panel"></div>
        <div id="help" class="panel">
          <div><b>Mouse</b> mirar</div>
          <div><b>WASD</b> mover</div>
          <div><b>Click / Espacio</b> atacar</div>
          <div><b>I</b> inventario</div>
          <div><b>E</b> recoger loot</div>
        </div>
        <div id="inv" class="panel"></div>
        <div id="toast" class="panel"></div>
        <div id="tooltip"></div>
        <div id="floaters"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
